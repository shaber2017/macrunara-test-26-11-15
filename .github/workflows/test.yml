name: Hello World Mac
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: [macos, arm64, macrunara]
    steps:
      - name: Say Hello
        run: |
          echo "Hello World from MacRunara!"
          echo "Current OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
